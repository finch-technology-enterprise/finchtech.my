# finchtech.my — Cloudflare Worker (Next.js via @opennextjs/cloudflare).
# Routes are declared here so `opennextjs-cloudflare deploy` (wrangler) binds
# finchtech.my/* + www.finchtech.my/* on the zone. The alternative is the
# Workers Routes UI — but only one source of truth. Spec §2.2.
name = "finchtech-my-frontend"
main = ".open-next/worker.js"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]
account_id = "28970b96b4880e4f41cc0487104898a0"
workers_dev = true

routes = [
  { pattern = "finchtech.my/*", zone_name = "finchtech.my" },
  { pattern = "www.finchtech.my/*", zone_name = "finchtech.my" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "finchtech-my-frontend"

# Durable fallback sink for contact enquiries. If Telegram/email delivery is
# unconfigured or failing, the enquiry is still persisted here rather than lost.
# See app/api/contact/route.ts.
[[kv_namespaces]]
binding = "CONTACT_INBOX"
id = "12ae7be74225482fbe9556d2b00748b9"

[vars]
ENVIRONMENT = "production"

# Observability must be enabled for `console.log`/`console.error` to reach
# Workers Logs. It was previously false while [observability.logs] was true —
# a contradiction that silently discarded every conversion event and, more
# seriously, the UNNOTIFIED_LEAD_IN_KV alert that tells the owner a real
# enquiry is waiting in KV with no notification channel configured.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
