# finchtech.my — Cloudflare Worker (Next.js via @opennextjs/cloudflare).
# Routes are declared here so `opennextjs-cloudflare deploy` (wrangler) binds
# finchtech.my/* + www.finchtech.my/* on the zone. The alternative is the
# Workers Routes UI — but only one source of truth. Spec §2.2.
name = "finchtech-my-frontend"
main = ".open-next/worker.js"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]
account_id = "28970b96b4880e4f41cc0487104898a0"
workers_dev = true

routes = [
  { pattern = "finchtech.my/*", zone_name = "finchtech.my" },
  { pattern = "www.finchtech.my/*", zone_name = "finchtech.my" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "finchtech-my-frontend"

[vars]
ENVIRONMENT = "production"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
